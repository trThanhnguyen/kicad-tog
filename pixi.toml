[workspace]
authors = ["Truong Thanh Nguyen <113072027+trThanhnguyen@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "kicad-tog"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
test = "pytest"
tog = { cmd = "python -m kicad_tog", env = { PYTHONPATH = "src" } }

[dependencies]
python = "3.12.*"
shapely = ">=2.2.0,<3"
matplotlib = ">=3.11.2,<4"
pytest = ">=9.2.0,<10"
